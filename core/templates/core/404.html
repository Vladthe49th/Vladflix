{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="notFound.title">Page Not Found | Cinemate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/404.css' %}">
    <link rel="stylesheet" href="{% static 'css/lang-switcher.css' %}">
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <a href="{% url 'core:index' %}" class="logo">Cinemate</a>
            <div class="lang-switcher">
                <button type="button" class="lang-switcher-btn" aria-haspopup="listbox" aria-expanded="false">
                    <span class="lang-switcher-current">EN</span>
                    <span class="lang-switcher-arrow">&#9662;</span>
                </button>
                <ul class="lang-switcher-menu" role="listbox">
                    <li role="option" data-lang="en" data-i18n="common.lang.en">English</li>
                    <li role="option" data-lang="uk" data-i18n="common.lang.uk">Українська</li>
                    <li role="option" data-lang="pl" data-i18n="common.lang.pl">Polski</li>
                </ul>
            </div>
        </header>
        <section class="hero">
            <img class="hero-image" src="{% static 'images/404_hero.png' %}" alt="404">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 class="hero-title" data-i18n="notFound.hero.title">Oh... 404. That's an error. This page has not been found</h1>
                <p class="hero-description" data-i18n="notFound.hero.description">That's all that we know. The page you are looking may have been moved, deleted or possibly never existed.</p>
            </div>
        </section>
    </div>
    <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
